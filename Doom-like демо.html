<style>
  /* Layout: one centred game screen with a controls strip below, single dark look. */
  :root {
    --bg: #0d0c10;
    --panel: #17151c;
    --line: #2e2a38;
    --fg: #e8e4ee;
    --muted: #9b94a8;
    --accent: #e2503c;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "Inter", system-ui, sans-serif;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    box-sizing: border-box;
  }
  canvas {
    width: min(100%, 960px); max-width: 100%; aspect-ratio: 8 / 5;
    image-rendering: pixelated; background: #000;
    border: 2px solid var(--line); cursor: crosshair; display: block; touch-action: none;
  }
  canvas:fullscreen { width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto; object-fit: contain; border: 0; }
  canvas:-webkit-full-screen { width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto; object-fit: contain; border: 0; }
  .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; color: var(--muted); max-width: 960px; margin: 0; padding: 0; list-style: none; }
  .keys li { min-width: 0; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--fg); font: 12px ui-monospace, Menlo, monospace; }
  h1 { margin: 0; font: 600 13px/1 "Inter", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
</style>

<script>
// Doom-like: raycasting FPS. Original code, original art and original synthesized music.
(function () {
  'use strict';

  // ===================================================================
  // Setup
  // ===================================================================
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const W = 640, H = 400, HUD_H = 64, VH = H - HUD_H, HORIZON = VH >> 1, PROJ = 230;
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  const viewCv = document.createElement('canvas'); viewCv.width = W; viewCv.height = VH;
  const vctx = viewCv.getContext('2d');
  const img = vctx.createImageData(W, VH);
  const buf = new Uint32Array(img.data.buffer);
  const zbuf = new Float32Array(W);
  const MAX_LEVEL = 30;
  const MID_BOSSES = [5, 15, 25], MAIN_BOSSES = [10, 20, 30];
  const isBossLevel = n => MID_BOSSES.indexOf(n) >= 0 || MAIN_BOSSES.indexOf(n) >= 0;

  const DIFFS = [
    { name: 'ЛЕГКА', hp: 0.7, dmg: 0.55, spd: 0.9, ammo: 1.4, count: 0.75, heal: 1.3 },
    { name: 'СЕРЕДНЯ', hp: 1, dmg: 1, spd: 1, ammo: 1, count: 1, heal: 1 },
    { name: 'НЕМОЖЛИВА', hp: 1.5, dmg: 1.9, spd: 1.25, ammo: 0.65, count: 1.3, heal: 0.7 },
  ];
  let diffIdx = 1;

  function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  // ===================================================================
  // Procedural textures
  // ===================================================================
  function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function toTex(c) { return new Uint32Array(c.getContext('2d').getImageData(0, 0, c.width, c.height).data.buffer); }
  function sh(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgb(' + Math.min(255, ((n >> 16) & 255) * f | 0) + ',' + Math.min(255, ((n >> 8) & 255) * f | 0) + ',' + Math.min(255, (n & 255) * f | 0) + ')';
  }
  // outline + top-light shading pass for character and prop sprites
  function finishTex(c) {
    const t = toTex(c), o = new Uint32Array(t.length);
    const solid = (x, y) => x >= 0 && y >= 0 && x < 64 && y < 64 && (t[y * 64 + x] >>> 24) >= 110;
    for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
      const p = t[y * 64 + x];
      if ((p >>> 24) < 110) continue;
      const edge = !solid(x - 1, y) || !solid(x + 1, y) || !solid(x, y - 1) || !solid(x, y + 1);
      const k = (1.14 - 0.38 * (y / 63)) * (edge ? 0.33 : 1);
      const r = clamp((p & 255) * k, 0, 255) | 0, g = clamp(((p >> 8) & 255) * k, 0, 255) | 0, b = clamp(((p >> 16) & 255) * k, 0, 255) | 0;
      o[y * 64 + x] = 0xff000000 | (b << 16) | (g << 8) | r;
    }
    return o;
  }

  function paintWall(kind, c1, c2, seed) {
    const c = mkCanvas(64, 64), g = c.getContext('2d'), r = mulberry(seed);
    g.fillStyle = c1; g.fillRect(0, 0, 64, 64);
    if (kind === 'brick') {
      for (let row = 0; row < 8; row++) {
        const off = row % 2 ? 8 : 0;
        for (let col = -1; col < 5; col++) {
          g.fillStyle = sh(c2, 0.7 + r() * 0.5); g.fillRect(col * 16 + off + 1, row * 8 + 1, 14, 6);
          g.fillStyle = 'rgba(255,255,255,0.1)'; g.fillRect(col * 16 + off + 1, row * 8 + 1, 14, 1);
          g.fillStyle = 'rgba(0,0,0,0.2)'; g.fillRect(col * 16 + off + 1, row * 8 + 6, 14, 1);
        }
      }
    } else if (kind === 'stone') {
      for (let i = 0; i < 700; i++) { g.fillStyle = sh(c2, 0.6 + r() * 0.7); g.fillRect(r() * 64 | 0, r() * 64 | 0, 2, 2); }
      g.strokeStyle = c1; g.lineWidth = 2; g.strokeRect(1, 1, 62, 62);
      g.beginPath(); g.moveTo(0, 32); g.lineTo(64, 32); g.moveTo(32, 0); g.lineTo(32, 32); g.moveTo(16, 32); g.lineTo(16, 64); g.moveTo(48, 32); g.lineTo(48, 64); g.stroke();
    } else if (kind === 'panel') {
      g.fillStyle = c2; g.fillRect(2, 2, 60, 60); g.fillStyle = c1; g.fillRect(6, 6, 52, 52);
      g.strokeStyle = sh(c2, 1.3); g.lineWidth = 1; g.strokeRect(10.5, 10.5, 43, 43);
      for (let i = 0; i < 4; i++) { g.fillStyle = r() > 0.5 ? '#3ddc84' : '#ff5555'; g.fillRect(14 + i * 10, 28, 5, 8); }
      g.fillStyle = 'rgba(255,255,255,0.1)'; g.fillRect(2, 2, 60, 2);
    } else if (kind === 'plate') {
      g.fillStyle = c2; g.fillRect(1, 1, 62, 62); g.fillStyle = sh(c2, 0.8); g.fillRect(4, 4, 56, 56);
      for (const [x, y] of [[6, 6], [57, 6], [6, 57], [57, 57], [32, 6], [32, 57]]) { g.fillStyle = sh(c2, 1.4); g.beginPath(); g.arc(x, y, 2, 0, 6.283); g.fill(); }
      g.strokeStyle = c1; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 32); g.lineTo(64, 32); g.stroke();
      for (let i = 0; i < 200; i++) { g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(r() * 64 | 0, r() * 64 | 0, 3, 1); }
    } else if (kind === 'tile') {
      for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
        g.fillStyle = sh(c2, 0.85 + r() * 0.3); g.fillRect(tx * 32 + 1, ty * 32 + 1, 30, 30);
        g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(tx * 32 + 1, ty * 32 + 1, 30, 2);
        g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(tx * 32 + 5, ty * 32 + 7, 10, 2);
      }
    } else if (kind === 'vein') {
      for (let i = 0; i < 900; i++) { g.fillStyle = sh(c2, 0.4 + r() * 0.9); g.fillRect(r() * 64 | 0, r() * 64 | 0, 3, 2); }
      g.strokeStyle = '#ff7a1a'; g.lineWidth = 2;
      for (let k = 0; k < 3; k++) { g.beginPath(); let x = r() * 64, y = 0; g.moveTo(x, y); while (y < 64) { x += (r() - 0.5) * 14; y += 6 + r() * 8; g.lineTo(x, y); } g.stroke(); }
    } else if (kind === 'slime') {
      for (let row = 0; row < 8; row++) { const off = row % 2 ? 8 : 0; for (let col = -1; col < 5; col++) { g.fillStyle = sh(c2, 0.6 + r() * 0.5); g.fillRect(col * 16 + off + 1, row * 8 + 1, 14, 6); } }
      for (let i = 0; i < 6; i++) { const x = r() * 60 | 0, len = 10 + r() * 36 | 0; g.fillStyle = 'rgba(120,255,60,0.55)'; g.fillRect(x, 0, 3, len); g.beginPath(); g.arc(x + 1.5, len, 3, 0, 6.283); g.fill(); }
    } else if (kind === 'gold') {
      for (let i = 0; i < 500; i++) { g.fillStyle = sh(c1, 0.6 + r() * 1.2); g.fillRect(r() * 64 | 0, r() * 64 | 0, 2, 2); }
      g.strokeStyle = c2; g.lineWidth = 2; g.strokeRect(3, 3, 58, 58);
      g.beginPath(); g.moveTo(32, 10); g.lineTo(54, 32); g.lineTo(32, 54); g.lineTo(10, 32); g.closePath(); g.stroke();
      g.fillStyle = c2; g.beginPath(); g.arc(32, 32, 4, 0, 6.283); g.fill();
    }
    return toTex(c);
  }
  function paintFloor(c1, c2, seed, ceil) {
    const c = mkCanvas(64, 64), g = c.getContext('2d'), r = mulberry(seed);
    for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) { g.fillStyle = sh((tx + ty) % 2 ? c1 : c2, 0.9 + r() * 0.2); g.fillRect(tx * 32, ty * 32, 32, 32); }
    for (let i = 0; i < 260; i++) { g.fillStyle = 'rgba(0,0,0,' + (0.08 + r() * 0.12) + ')'; g.fillRect(r() * 64 | 0, r() * 64 | 0, 2, 2); }
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 2; g.strokeRect(0, 0, 64, 64);
    g.beginPath(); g.moveTo(32, 0); g.lineTo(32, 64); g.moveTo(0, 32); g.lineTo(64, 32); g.stroke();
    if (ceil) { g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(12, 12, 8, 8); g.fillRect(44, 44, 8, 8); }
    return toTex(c);
  }
  const THEMES = [
    { name: 'Склади', walls: [['brick', '#2a1a16', '#8a4636'], ['panel', '#222b36', '#5a6c82'], ['plate', '#33343a', '#767883']], floor: ['#3a322c', '#2a2420'], ceil: ['#26262e', '#1c1c24'], fog: [14, 10, 10] },
    { name: 'Бункер', walls: [['stone', '#26262b', '#6c6c74'], ['plate', '#2d3138', '#7a828f'], ['panel', '#262a30', '#6a7684']], floor: ['#34363a', '#2a2c30'], ceil: ['#202226', '#181a1e'], fog: [10, 12, 14] },
    { name: 'Цитадель пекла', walls: [['vein', '#2a0e0a', '#6e2414'], ['stone', '#3a1a14', '#7a3626'], ['vein', '#1e0a08', '#8a2c14']], floor: ['#3a1612', '#2a0e0c'], ceil: ['#220c0a', '#180706'], fog: [40, 8, 4] },
    { name: 'Крижані копальні', walls: [['tile', '#1d3a4a', '#6fb1cc'], ['stone', '#243a48', '#8fc4dc'], ['panel', '#1b3040', '#5a94b0']], floor: ['#2a4656', '#223a48'], ceil: ['#1a2e3c', '#142430'], fog: [6, 18, 28] },
    { name: 'Токсичні стоки', walls: [['slime', '#1c2a14', '#5a7a30'], ['brick', '#1a2412', '#486a28'], ['plate', '#1f2a1c', '#6a8a50']], floor: ['#2e3a22', '#222c18'], ceil: ['#161e10', '#10160c'], fog: [8, 22, 6] },
    { name: 'Трон безодні', walls: [['gold', '#17121e', '#d9a73a'], ['stone', '#1c1626', '#5a4a72'], ['gold', '#120e18', '#b88a2a']], floor: ['#2a2234', '#1e1828'], ceil: ['#120e18', '#0c0910'], fog: [18, 10, 26] },
  ];
  function themeFor(n) { if (MAIN_BOSSES.indexOf(n) >= 0) return 5; if (MID_BOSSES.indexOf(n) >= 0) return 2; return [0, 1, 3, 4][(n - 1) % 4]; }
  const themeCache = {};
  function themeTex(i) {
    if (themeCache[i]) return themeCache[i];
    const t = THEMES[i];
    return (themeCache[i] = {
      walls: t.walls.map((w, k) => paintWall(w[0], w[1], w[2], 100 + i * 10 + k)),
      floor: paintFloor(t.floor[0], t.floor[1], 500 + i, false),
      ceil: paintFloor(t.ceil[0], t.ceil[1], 700 + i, true),
      fog: t.fog,
    });
  }
  // ambient-occlusion ramp along the height of a wall (top and bottom edges darker)
  const AO = new Int16Array(64);
  for (let v = 0; v < 64; v++) AO[v] = Math.round(256 * (0.72 + 0.28 * Math.min(1, Math.min(v, 63 - v) / 9)));

  // ===================================================================
  // Monster sprites (all original designs; roles inspired by classic shooters)
  // ===================================================================
  // Redesigned silhouettes: distinct, original shapes for the signature monsters and bosses.
  function paintRedesign(type, f, g) {
    const bob = f === 1 ? 2 : 0, atk = f === 2;
    const E = (x, y, rx, ry, col) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 6.283); g.fill(); };
    const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    const P = (pts, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); };
    const Ln = (x1, y1, x2, y2, col, w) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
    const legA = f === 1 ? 7 : 11, legB = f === 1 ? 11 : 7;
    switch (type) {
      case 'imp': // winged gargoyle
        P([32, 28, 2, 10 + bob, 8, 44], '#2e4650'); P([32, 28, 62, 10 + bob, 56, 44], '#2e4650'); P([32, 30, 6, 18, 12, 46], '#3a5662'); P([32, 30, 58, 18, 52, 46], '#3a5662');
        R(23, 62 - legA, 8, legA, '#2a3c44'); R(34, 62 - legB, 8, legB, '#2a3c44');
        E(32, 42 + bob, 13, 16, '#4a6670'); E(32, 46 + bob, 8, 10, '#6a8892');
        if (atk) { R(14, 22, 5, 20, '#4a6670'); E(15, 20, 7, 7, '#ffb030'); E(15, 20, 3.5, 3.5, '#fff2a8'); R(45, 28, 5, 16, '#4a6670'); }
        else { R(16, 38 + bob, 5, 14, '#4a6670'); R(43, 38 + bob, 5, 14, '#4a6670'); P([15, 52 + bob, 18, 59, 21, 52 + bob], '#e8e4d0'); P([43, 52 + bob, 46, 59, 49, 52 + bob], '#e8e4d0'); }
        P([24, 20 + bob, 12, 8 + bob, 24, 27 + bob], '#4a6670'); P([40, 20 + bob, 52, 8 + bob, 40, 27 + bob], '#4a6670');
        E(32, 24 + bob, 9, 9, '#5a7882'); R(26, 22 + bob, 4, 2, '#ffa030'); R(34, 22 + bob, 4, 2, '#ffa030'); R(28, 29 + bob, 8, 2, '#1a0a0a');
        P([29, 29 + bob, 30, 33 + bob, 31, 29 + bob], '#fff'); P([33, 29 + bob, 34, 33 + bob, 35, 29 + bob], '#fff'); break;
      case 'bull': // armored boar
        R(14, 50 - (f === 1 ? 3 : 0), 8, 12, '#2a2218'); R(24, 50, 8, 12 - (f === 1 ? 0 : 3), '#2a2218'); R(34, 50 - (f === 1 ? 0 : 3), 8, 12, '#2a2218'); R(44, 50, 8, 12 - (f === 1 ? 3 : 0), '#2a2218');
        E(34, 40 + bob, 24, 15, '#6a5642'); for (let i = 0; i < 6; i++) P([14 + i * 8, 30 + bob, 17 + i * 8, 19 + bob, 20 + i * 8, 30 + bob], '#2a2218');
        E(21, 25, 4, 5, '#5a4634'); E(43, 25, 4, 5, '#5a4634');
        E(32, 32 + bob, 14, 12, '#7a6450'); E(32, 39 + bob, 8, 6, '#a08468'); E(29, 39 + bob, 1.5, 1.8, '#2a1a14'); E(35, 39 + bob, 1.5, 1.8, '#2a1a14');
        P([23, 40 + bob, 18, 28 + bob, 27, 37 + bob], '#f2ecd8'); P([41, 40 + bob, 46, 28 + bob, 37, 37 + bob], '#f2ecd8');
        E(26, 29 + bob, 2.2, 2.2, '#ff3a2a'); E(38, 29 + bob, 2.2, 2.2, '#ff3a2a'); if (atk) R(28, 42 + bob, 8, 4, '#2a0a0a'); break;
      case 'lord': // steel-blue armored warlord with golden horns
        R(21, 62 - legA - 3, 10, legA + 3, '#1c2040'); R(34, 62 - legB - 3, 10, legB + 3, '#1c2040');
        P([5, 30 + bob, 11, 20 + bob, 15, 34 + bob], '#d9a73a'); P([59, 30 + bob, 53, 20 + bob, 49, 34 + bob], '#d9a73a');
        if (atk) { R(5, 12, 8, 24, '#2c3560'); R(51, 12, 8, 24, '#2c3560'); E(9, 10, 7, 7, '#7ae8ff'); E(55, 10, 7, 7, '#7ae8ff'); E(9, 10, 3, 3, '#fff'); E(55, 10, 3, 3, '#fff'); }
        else { R(6, 28 + bob, 8, 26, '#2c3560'); R(50, 28 + bob, 8, 26, '#2c3560'); P([6, 54 + bob, 10, 62, 14, 54 + bob], '#d9a73a'); P([50, 54 + bob, 54, 62, 58, 54 + bob], '#d9a73a'); }

        E(32, 38 + bob, 5, 5, atk ? '#ffd23f' : '#7ae8ff'); E(32, 38 + bob, 2, 2, '#fff');

        E(32, 14 + bob, 11, 10, '#8a8fb0'); R(23, 12 + bob, 18, 5, '#101830'); R(26, 13 + bob, 4, 2, '#7ae8ff'); R(34, 13 + bob, 4, 2, '#7ae8ff'); R(26, 21 + bob, 12, 5, '#6a6f90'); break;
      case 'mancubus': // bloated toad with arm cannons
        R(20, 60, 8, 4, '#2a3a1a'); R(36, 60, 8, 4, '#2a3a1a');
        E(32, 42 + bob, 25, 20, '#5a7a3a'); E(32, 46 + bob, 17, 13, '#a8c27a');
        R(2, 30 + bob, 14, 11, '#3a3a42'); R(48, 30 + bob, 14, 11, '#3a3a42'); E(3, 35 + bob, atk ? 6 : 3, atk ? 6 : 3, atk ? '#ffb030' : '#ff6a1a'); E(61, 35 + bob, atk ? 6 : 3, atk ? 6 : 3, atk ? '#ffb030' : '#ff6a1a');

        const bn = '#e8e4d0', bd = '#9a9684';

        E(32, 24 + bob, 9, 9, '#8a8e9a'); R(25, 22 + bob, 14, 4, '#15151a'); E(28, 24 + bob, 1.4, 1.4, '#ff3b1a'); E(36, 24 + bob, 1.4, 1.4, '#ff3b1a'); R(26, 29 + bob, 12, 4, bn);
        R(38, 14 + bob, 20, 10, '#4a4a52'); R(56, 15 + bob, 6, 8, atk ? '#ffb030' : '#c0301a'); if (atk) E(62, 19, 3, 3, '#fff2a8');
        R(14, 30 + bob, 3, 20, bn); R(47, 30 + bob, 3, 14, bn); break;

  // arrow around the crosshair pointing at the nearest remaining enemy (hidden when it is already on screen)
  function drawEnemyArrow() {
    let best = null, bd = Infinity;
    for (const e of hintTargets()) { const d = Math.hypot(e.x - player.x, e.y - player.y); if (d < bd) { bd = d; best = e; } }
    if (!best) return;
    let rel = Math.atan2(best.y - player.y, best.x - player.x) - player.angle;
    rel = Math.atan2(Math.sin(rel), Math.cos(rel));
    if (Math.abs(rel) < 0.5 && los(player.x, player.y, best.x, best.y)) return;
    const R = 58, cx = W / 2 + Math.sin(rel) * R, cy = VH / 2 - Math.cos(rel) * R;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rel);
    ctx.globalAlpha = 0.6 + 0.3 * Math.sin(time * 6);
    ctx.fillStyle = '#ff9a3c'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(7, 5); ctx.lineTo(0, 1); ctx.lineTo(-7, 5); ctx.closePath(); ctx.stroke(); ctx.fill();
    ctx.restore();
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    textShadow(Math.round(bd) + 'м', W / 2 + Math.sin(rel) * (R + 16), VH / 2 - Math.cos(rel) * (R + 16) + 4, '#ffbe7a');
    ctx.textAlign = 'left';
  }

      centerText(level >= MAX_LEVEL ? 'Enter: фінал' : 'Enter: наступний рівень (+' + completeHeal() + ' здоров\'я)', 200, 14, '#ffd23f'); ctx.globalAlpha = 1;
    } else if (state === 'victory') {
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, W, H);
      centerText('ПЕРЕМОГА!', 130, 46, '#ffd23f');
      centerText('Ви пройшли всі ' + MAX_LEVEL + ' рівнів і зупинили Серце Безодні.', 180, 14, '#ddd');
      ctx.globalAlpha = screenReady() ? 1 : 0.35; centerText('Складність: ' + DIFFS[diffIdx].name + '. Enter: на головний екран', 220, 14, '#3ddc84'); ctx.globalAlpha = 1;
    }
  }

  function drawTitle() {
    ctx.fillStyle = '#0d0c10'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 90; i++) { ctx.fillStyle = 'rgba(200,60,40,' + (0.05 + (i % 5) * 0.03) + ')'; ctx.fillRect((i * 83) % W, H - ((i * 37 + time * 24) % 220), 3, 3); }
    centerText('DOOM-LIKE', 96, 64, '#e2503c');
    centerText('30 рівнів · 27 монстрів · 10 видів зброї · 6 босів', 132, 15, '#e8e4ee');
    if (!player) player = newPlayer();
    const sv = player.hp; player.hp = 100; drawFace(W / 2 - 35, 140, 70); player.hp = sv;
    ctx.font = '11px monospace'; ctx.fillStyle = '#9b94a8'; ctx.fillText(soundLabel() + ' (M)', 10, 18);
    if (bestLevel > 0) { ctx.font = '11px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#9b94a8'; ctx.fillText(bestLevel >= MAX_LEVEL ? 'Рекорд: гру пройдено' : 'Рекорд: рівень ' + bestLevel, W - 10, 18); ctx.textAlign = 'left'; }
    centerText(savedGame ? 'СКЛАДНІСТЬ НОВОЇ ГРИ' : 'СКЛАДНІСТЬ', 228, 12, '#9b94a8');
    for (let i = 0; i < 3; i++) {
      const b = BTN[i], on = i === diffIdx;
      ctx.fillStyle = on ? (i === 2 ? '#8a1e14' : i === 1 ? '#b88a1e' : '#2a7a4a') : '#1c1a22'; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = on ? '#fff' : '#4a4552'; ctx.lineWidth = on ? 2 : 1; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
      ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = on ? '#fff' : '#8a8494'; ctx.fillText(DIFFS[i].name, b.x + b.w / 2, b.y + 22); ctx.textAlign = 'left';
    }
    if (savedGame) {
      const armed = time < newGameArmT;
      const btn = (b, fill, stroke, label, col) => {
        ctx.fillStyle = fill; ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
        ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = col; ctx.fillText(label, b.x + b.w / 2, b.y + 18); ctx.textAlign = 'left';
      };
      btn(CONT_BTN, '#3a2a10', '#ffd23f', '▶ ПРОДОВЖИТИ: РІВЕНЬ ' + savedGame.level + ' · ' + DIFFS[savedGame.diffIdx].name, '#ffd23f');
      btn(NEW_BTN, armed ? '#5a140e' : '#1c1a22', armed ? '#ff6a50' : '#4a4552', armed ? 'ТОЧНО? ЩЕ РАЗ' : 'НОВА ГРА (N)', armed ? '#fff' : '#c8c2d2');
      ctx.font = '10px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = armed ? '#ff8a70' : '#7a7486';
      ctx.fillText(armed ? 'Нова гра перезапише збережений прогрес' : 'Enter: продовжити · N: нова гра', W / 2, 316); ctx.textAlign = 'left';
    } else centerText('Клік повз кнопки або Enter: почати', 296, 16, '#ffd23f');
    ctx.font = '11px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#9b94a8';
    ctx.fillText('WASD рух · миша або ←→ поворот · клік або Пробіл вогонь', W / 2, 330);
    ctx.fillText('1-9, 0 зброя · Q/E або колесо перемикання · R рестарт · M звук · Esc/P пауза · F повний екран', W / 2, 344);
    ctx.fillText('Вбийте всіх або знайдіть ключ-кристал, потім дійдіть до порталу', W / 2, 358);
    ctx.fillText('Боси: рівні 5, 15, 25 (середні) та 10, 20, 30 (головні). На старті діє захисне поле', W / 2, 372);
    ctx.fillText('Патрони обмежені, бензопила без патронів', W / 2, 386);
    ctx.textAlign = 'left';
  }

  function render() {
    if (state === 'title') { drawTitle(); return; }
    renderWorld(); drawWeapon(); drawMinimap(); drawOverlays(); drawHud(); drawScreens();
  }

  // ===================================================================
  // Loop
  // ===================================================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const isPaused = state === 'play' && paused;
    if (state === 'title') time += dt; else if (!isPaused) update(dt);
    const bossFight = state === 'play' && bosses.some(b => !b.dead && b.alert);
    music.setMode(state === 'dead' || isPaused ? 'off' : (state === 'play' ? (bossFight ? 'boss' : 'r' + ((level - 1) % 4)) : 'title'));
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__doom = {
    genLevel, startLevel, newGame, update, render, bfsGrid, DEFS, TYPES, MAX_LEVEL, keys, MON_TEX, WEAPONS, MAX_AMMO,
    setDiff(i) { diffIdx = i; },
    get state() { return state; }, set state(v) { state = v; },
    get player() { return player; }, get enemies() { return enemies; }, get L() { return L; }, get level() { return level; },
    get hasKey() { return hasKey; }, get exitOpen() { return exitOpen; }, get shield() { return shield; }, set shield(v) { shield = v; },
    get parts() { return parts.length; }, get pballs() { return pballs.length; }, get decals() { return decals.length; }, get corpses() { return corpses; },
  };
})();

</script>
