<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Doom-like демо</title>
<style>
  /* Layout: one centred game screen with a controls strip below, single dark look. */
  :root {
    --bg: #0d0c10;
    --panel: #17151c;
    --line: #2e2a38;
    --fg: #e8e4ee;
    --muted: #9b94a8;
    --accent: #e2503c;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "Inter", system-ui, sans-serif;
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    box-sizing: border-box;
  }
  canvas {
    width: min(100%, 960px); max-width: 100%; aspect-ratio: 8 / 5;
    image-rendering: pixelated; background: #000;
    border: 2px solid var(--line); cursor: crosshair; display: block; touch-action: none;
  }
  canvas:fullscreen { width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto; object-fit: contain; border: 0; }
  canvas:-webkit-full-screen { width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto; object-fit: contain; border: 0; }
  .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; color: var(--muted); max-width: 960px; margin: 0; padding: 0; list-style: none; }
  .keys li { min-width: 0; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--fg); font: 12px ui-monospace, Menlo, monospace; }
  [hidden] { display: none !important; }
  @media (pointer: coarse) { .keys { display: none; } }
  h1 { margin: 0; font: 600 13px/1 "Inter", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
</style>
</head>
<body>
<h1>Doom-like · демо</h1>
<canvas id="screen" width="640" height="400" tabindex="0"></canvas>
<ul class="keys">
  <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> рух</li>
  <li><kbd>←</kbd><kbd>→</kbd> або миша: поворот</li>
  <li>клік, <kbd>Пробіл</kbd> або <kbd>Ctrl</kbd>: вогонь</li>
  <li><kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd>, <kbd>Q</kbd><kbd>E</kbd> або колесо миші: зброя</li>
  <li><kbd>R</kbd> рестарт рівня</li>
  <li><kbd>Esc</kbd>/<kbd>P</kbd> пауза</li>
  <li><kbd>M</kbd> гучність</li>
  <li><kbd>[</kbd><kbd>]</kbd> чутливість миші</li>
  <li><kbd>F</kbd> повний екран</li>
</ul>
<!-- Doom-like: raycasting FPS. Original code, original art and original synthesized music. -->
<script src="js/core.js"></script>
<script src="js/textures.js"></script>
<script src="js/monsters.js"></script>
<script src="js/level.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/touch.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>

</body>
</html>
